name: Build Deb via Docker

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Theos Docker
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            theos/theos:latest \
            bash -c "make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: lockettok-deb
          path: packages/*.deb
