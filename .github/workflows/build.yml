name: Build Deb

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf /tmp/sdk.tar.xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS16.5.sdk $HOME/theos/sdks/ 2>/dev/null || \
          cp -r /tmp/sdks-master/iPhoneOS*.sdk $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: lockettok-deb
          path: packages/*.deb
